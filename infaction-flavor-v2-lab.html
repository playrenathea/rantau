<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Infaction · Naming Lab</title><style>
*{box-sizing:border-box}body{background:#efeee9;color:#29302a;font:15px/1.5 system-ui;margin:0}
main{max-width:660px;margin:auto;background:#fcfbf8;min-height:100vh;padding:30px}
a{color:#385f47}h1{font:normal 32px Georgia,serif}
p{color:#70796e}label{display:block;margin-top:14px;font-size:13px}
input,select{width:100%;padding:11px;border:1px solid #ccd4c8;border-radius:7px;background:#fff;font:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.output{font:normal 27px Georgia,serif;margin:26px 0;border-top:1px solid #dfe5db;padding-top:24px}
small{color:#8c9788}@media(max-width:480px){.grid{grid-template-columns:1fr}main{padding:22px}}
</style></head><body><main><a href="./">← Infaction</a>
<h1>Naming Lab</h1><p>Place names reflect ownership. Flavor is no longer used for any Place, including City.</p>
<div class="grid"><div><label for="kind">Ownership</label><select id="kind"><option value="single">Single</option><option value="dual">Dual</option><option value="none">None</option><option value="city">City</option></select></div>
<div><label for="animal">Animal</label><input id="animal" value="Wolf" autocomplete="off"></div></div>
<label for="place">Place name</label><input id="place" value="Fortress" autocomplete="off">
<div class="output" id="result" aria-live="polite"></div>
<small>Single: The Animal's Place · Dual: The Place · None: Place · City: The Animal's City</small>
</main><script>
const kind=document.getElementById('kind'),animal=document.getElementById('animal'),place=document.getElementById('place'),result=document.getElementById('result');
function render(){
 const a=animal.value.trim()||'Animal',p=place.value.trim()||'Place';
 const k=kind.value;
 place.disabled=k==='city';
 animal.disabled=k==='dual'||k==='none';
 result.textContent=k==='city'?"The "+a+"'s City":k==='single'?"The "+a+"'s "+p:k==='dual'?"The "+p:p;
}
for(const control of [kind,animal,place]){control.addEventListener('input',render);control.addEventListener('change',render)}
render();
</script></body></html>
