<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Infaction</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#efeee9;color:#252923;font:16px system-ui,sans-serif}main{max-width:620px;min-height:100dvh;margin:auto;background:#fcfbf7;padding:24px 22px calc(28px + env(safe-area-inset-bottom,0px))}button,input{font:inherit;color:inherit}button{cursor:pointer;background:#f5f4ee;border:1px solid #d6d9cf;border-radius:8px;padding:10px 14px;touch-action:manipulation}button:hover{background:#eaece4}button:active{background:#dce5d9}button:focus-visible,input:focus-visible{outline:2px solid #637a64;outline-offset:3px}button:disabled{opacity:.5}h1,h2{font-family:Georgia,serif;font-weight:normal}h1{font-size:34px;line-height:1.16;margin:10px 0 8px;overflow-wrap:anywhere}h2{font-size:19px;margin:0 0 12px}small,.muted{color:#72776e;font-size:13px}p{line-height:1.6}.intro{min-height:82dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px}.intro h1{font-size:43px}.intro button{min-width:160px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:28px}.brand{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6a7567;font-weight:650}.iconButton{border:0;background:transparent;font-size:22px;padding:6px 10px}.crumbs{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12px;color:#858a7f}.crumbs button{font-size:12px;padding:5px 0;background:transparent;border:0;color:#667260;text-align:left}.crumbs button:hover{text-decoration:underline}.sub{border-bottom:1px solid #dedfd6;padding-bottom:20px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}.tag{font-size:11px;padding:2px 7px;background:#e9ece4;color:#586452;border-radius:4px}.tag.hidden{background:#eae4f1;color:#726385}.places{margin-top:24px}.destination{background:transparent;display:flex;align-items:center;gap:12px;width:100%;border:0;border-bottom:1px solid #e5e5dc;border-radius:0;padding:16px 2px;text-align:left}.destination:hover{background:#f0f1e9}.destinfo{flex:1;min-width:0}.destlabel{display:block;font-weight:520;overflow-wrap:anywhere}.destmeta{display:block;color:#7b8176;font-size:12px;margin-top:4px}.symbol{width:23px;color:#677460;font-size:19px;text-align:center}.arrow{color:#888e82}.back{margin:22px 0 0;background:transparent;width:100%;text-align:left}.empty{font-size:14px;color:#84887e;padding:12px 0}.controls{margin-top:30px;border-top:1px solid #e1e2d9;padding-top:15px}.controls summary{cursor:pointer;font-size:13px;color:#747d6e}.controlrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:13px;font-size:13px}.controlrow input[type=number]{border:1px solid #d1d5ca;background:white;border-radius:5px;min-width:0;width:145px;padding:8px}.controlrow button{font-size:13px}.stats{font-size:12px;color:#7a8075;line-height:1.7}.note{font-size:12px;color:#838a7f}.error{color:#874747}
</style></head><body><main id="app"></main><script src="place-generator.js"></script><script src="world-generator.js"></script><script>
(function(){
"use strict";
const app=document.getElementById("app"),key="infaction-place-navigation-v0.11";
const G=window.InfactionWorld;
const randomSeed=()=>{if(window.crypto&&crypto.getRandomValues){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]}return Math.floor(Math.random()*4294967296)};
let state=null,world=null,nodes=new Map(),parents=new Map();
function el(tag,cls,text){const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e}
function btn(label,cls,fn){const b=el("button",cls,label);b.type="button";b.addEventListener("click",fn);return b}
function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(key));if(s&&s.version===G.version&&Number.isInteger(s.seed))return s}catch(e){}return null}
function indexTree(root){nodes=new Map();parents=new Map();function walk(q,p){nodes.set(q.id,q);if(p)parents.set(q.id,p.id);for(const c of q.children)walk(c,q)}walk(root,null)}
function init(seed,reset=true){world=G.generate(seed>>>0);indexTree(world.spatialTree);if(reset||!state)state={version:G.version,seed:seed>>>0,current:"land",reveal:false};if(!nodes.has(state.current))state.current="land";if(!state.reveal)while(nodes.get(state.current)?.secret)state.current=parents.get(state.current)||"land";save();render()}
function go(id){if(!nodes.has(id))return;state.current=id;save();render();window.scrollTo(0,0)}
function intro(){app.replaceChildren();const box=el("div","intro");box.append(el("span","brand","INFACTION"),el("h1","","The Land awaits."),el("p","muted","A different world, every time."),btn("Begin","",()=>init(randomSeed())));app.append(box)}
function render(){app.replaceChildren();const q=nodes.get(state.current);if(!q)return intro();const top=el("div","top");top.append(el("span","brand","Infaction"),el("small","","Navigation prototype"));app.append(top);
 const chain=[];let c=q;while(c){chain.unshift(c);c=nodes.get(parents.get(c.id))}const crumbs=el("nav","crumbs");crumbs.setAttribute("aria-label","Location path");chain.slice(0,-1).forEach(a=>{crumbs.append(btn(a.label,"",()=>go(a.id)),el("span","","›"))});if(chain.length>1)app.append(crumbs);
 app.append(el("h1","",q.label));const sub=el("div","sub");if(q.scale)sub.append(el("span","tag","Scale "+q.scale));if(q.secret)sub.append(el("span","tag hidden","Hidden"));if(q.region)sub.append(el("small","",q.region));app.append(sub);
 const list=el("section","places");list.append(el("h2","","Places"));const kids=q.children.filter(x=>state.reveal||!x.secret);
 if(!kids.length)list.append(el("p","empty","No places to enter."));
 for(const child of kids){let b=btn("","destination",()=>go(child.id));const info=el("span","destinfo");info.append(el("span","destlabel",child.label));if(child.secret)info.append(el("span","destmeta","Hidden"));b.append(el("span","symbol",child.id==="city"?"◇":child.children.length?"▣":"·"),info,el("span","arrow","›"));list.append(b)}
 app.append(list);if(parents.has(q.id)){const p=nodes.get(parents.get(q.id));app.append(btn("‹  Back to "+p.label,"back",()=>go(p.id)))}
 const det=el("details","controls");det.append(el("summary","","Prototype controls"));const row=el("label","controlrow");const chk=el("input");chk.type="checkbox";chk.checked=state.reveal;chk.addEventListener("change",()=>{state.reveal=chk.checked;if(!state.reveal){let path=state.current;while(path){if(nodes.get(path)?.secret){state.current=parents.get(path)||"land"}path=parents.get(path)}}save();render()});row.append(chk,el("span","","Reveal hidden places (debug)"));det.append(row);
 const form=el("form","controlrow");const input=el("input");input.type="number";input.min="0";input.max="4294967295";input.step="1";input.value=state.seed;input.setAttribute("aria-label","World seed");const loadButton=el("button","","Load seed");loadButton.type="submit";form.append(input,loadButton);form.addEventListener("submit",e=>{e.preventDefault();if(input.checkValidity()&&input.value!=="")init(Number(input.value));});det.append(form,btn("New universe","",()=>{if(confirm("Generate a new universe?"))init(randomSeed())}),el("p","stats",world.zones.length+" zones · "+world.locations.length+" locations · "+world.sites.length+" sites"),el("p","note","World "+G.version+" · Place "+world.placeVersion));app.append(det)
}
try{state=load();if(state)init(state.seed,false);else intro()}catch(e){app.replaceChildren(el("h1","","Unable to generate world"),el("p","error",String(e)),btn("Retry","",()=>{state=null;intro()}))}
})();
</script></body></html>
