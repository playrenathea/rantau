function populate(state){state.npcs=InfactionNPC.generate(state.f,{city:state.city,pinned:(state.npcs||[]).filter(n=>n.pinned)});state.npcVersion=InfactionNPC.version;return state}function fresh(){const w=InfactionWorld.generate();return populate({stage:0,worldVersion:w.version,city:w.city,f:w.factions,hour:17,money:10,pass:false,uniform:false,knowledge:1,errand:0,heat:0,log:'',tab:'gate',outcome:''})}
let s;try{s=JSON.parse(localStorage.getItem(key))||fresh();if(s.worldVersion!==InfactionWorld.version){s=fresh();save()}else if(s.npcVersion!==InfactionNPC.version){s.npcs=[];populate(s);save()}}catch(e){s=fresh()}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}
let menu,anchor,feedbackTimer;function close(){menu?.remove();menu=null;anchor?.classList.remove('menu-anchor');anchor=null}function feedback(msg){clearTimeout(feedbackTimer);document.querySelector('.feedback')?.remove();const el=document.createElement('div');el.className='feedback'+(s.stage<2?' intro-feedback':'');el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.textContent=msg;document.body.append(el);feedbackTimer=setTimeout(()=>el.remove(),3800)}function hold(button,options,tap){let timer,held=false,x,y;button.onpointerdown=e=>{close();held=false;x=e.clientX;y=e.clientY;timer=setTimeout(()=>{held=true;show(button,options)},450)};button.onpointermove=e=>{if(Math.abs(e.clientX-x)+Math.abs(e.clientY-y)>12)clearTimeout(timer)};button.onpointerup=button.onpointercancel=button.onpointerleave=()=>clearTimeout(timer);button.oncontextmenu=e=>{e.preventDefault();held=true;show(button,options)};button.onclick=()=>{if(!held)tap();held=false};button.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ContextMenu'){e.preventDefault();show(button,options)}}}
function show(b,opts,title,subtitle){
 close();const card=b.closest('.npc-card');title=title||b.dataset.menuTitle||(card?card._npc.name:b.id==='more'?'Menu':b.id==='time'?'Time':b.id==='location'?'City Gate':b.classList.contains('destination')?s.city:b.textContent.trim()||'Actions');
 subtitle=subtitle||b.dataset.menuSubtitle||(card?'Interaction':'');
 menu=document.createElement('div');menu.className='bubble';menu.setAttribute('role','group');menu.setAttribute('aria-label',title);const hd=document.createElement('div');hd.className='menu-heading';const ht=document.createElement('span');ht.className='menu-title';ht.textContent=title;hd.append(ht);if(subtitle){const sub=document.createElement('span');sub.className='menu-subtitle';sub.textContent=subtitle;hd.append(sub)}menu.append(hd);
 for(let [label,fn,alt] of opts){const a=document.createElement('button');a.type='button';a.textContent=label;let timer,held=false,x,y;function activate(f){close();f()}a.onclick=e=>{e.stopPropagation();if(!held)activate(fn);held=false};if(alt){a.className='nested-action';a.onpointerdown=e=>{held=false;x=e.clientX;y=e.clientY;if(e.pointerType!=='mouse'&&e.button===0)timer=setTimeout(()=>{held=true;activate(alt)},450)};a.onpointermove=e=>{if(Math.hypot(e.clientX-x,e.clientY-y)>10)clearTimeout(timer)};a.onpointerup=a.onpointercancel=a.onpointerleave=()=>clearTimeout(timer);a.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();clearTimeout(timer);held=true;activate(alt)};a.onkeydown=e=>{if(e.key==='ContextMenu'||(e.shiftKey&&e.key==='F10')){e.preventDefault();activate(alt)}}}menu.append(a)}
 document.body.append(menu);anchor=b;anchor.classList.add('menu-anchor');const r=b.getBoundingClientRect(),w=menu.offsetWidth,below=innerHeight-r.bottom-12,above=r.top-12;const useAbove=menu.offsetHeight>below&&above>below;menu.style.maxHeight=Math.max(100,useAbove?above:below)+'px';const mh=menu.offsetHeight;menu.style.left=Math.max(12,Math.min(r.left,innerWidth-w-12))+'px';menu.style.top=Math.max(12,Math.min(useAbove?r.top-mh-7:r.bottom+7,innerHeight-mh-12))+'px';
}
function button(parent,label,tap,opts=[]){let b=document.createElement('button');b.textContent=label;parent.append(b);if(opts.length)hold(b,opts,tap);else b.onclick=tap;return b}
function update(msg,hours=0){s.log=msg;s.hour=((s.hour+hours)%24+24)%24;save();render();feedback(msg)}function enter(method,detail){s.stage=3;s.outcome=method;s.log=detail;save();render()}const night=()=>s.hour>=19||s.hour<6;const clock=()=>{let m=Math.round(s.hour*60)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};function waitUntil(){close();let panel=document.createElement('div');panel.className='bubble';panel.style.left='50%';panel.style.top='32%';panel.style.transform='translateX(-50%)';let form=document.createElement('form');form.innerHTML='<label for="target-time">Wait until</label><input id="target-time" type="time" required><button type="submit">Wait</button><button type="button" id="cancel-wait">Cancel</button>';panel.append(form);document.body.append(panel);menu=panel;let input=form.querySelector('input');input.value=clock();form.querySelector('#cancel-wait').onclick=close;form.onsubmit=e=>{e.preventDefault();if(!input.value)return;let [h,m]=input.value.split(':').map(Number),target=h+m/60,elapsed=(Math.round(target*60)-Math.round(s.hour*60)+1440)%1440;if(!elapsed)elapsed=1440;s.heat=Math.max(0,s.heat-Math.floor(elapsed/60));s.hour=target;populate(s);update('You wait until '+clock()+'.')};}

// Interaction beats persist until the player closes them. World state is committed before the beat.
function closeBeat(){document.querySelector('.beat-backdrop')?.remove()}
function beat(n,action,story,outcome='',dialogue=''){close();closeBeat();document.querySelector('.feedback')?.remove();const bg=document.createElement('div');bg.className='beat-backdrop';const panel=document.createElement('section');panel.className='beat-panel';panel.tabIndex=-1;panel.setAttribute('role','dialog');panel.setAttribute('aria-modal','true');panel.setAttribute('aria-label',n.name+' — '+action);const head=document.createElement('div');head.className='beat-head';const info=document.createElement('div');const title=document.createElement('h2');title.className='beat-title';title.textContent=n.name;const context=document.createElement('div');context.className='beat-context';context.textContent=action;info.append(title,context);const x=document.createElement('button');x.className='beat-close';x.textContent='×';x.setAttribute('aria-label','Close');x.onclick=closeBeat;head.append(info,x);panel.append(head);for(const [cl,txt] of [['beat-story',story],['beat-dialogue',dialogue?'“'+dialogue+'”':''],['beat-outcome',outcome]])if(txt){const p=document.createElement('div');p.className=cl;p.textContent=txt;panel.append(p)}bg.append(panel);document.body.append(bg);x.focus()}
function resolve(n,action,story,outcome='',hours=0,dialogue=''){s.log=outcome||story;s.hour=((s.hour+hours)%24+24)%24;save();render();beat(n,action,story,outcome,dialogue)}
function finishEntry(n,action,method,story,dialogue=''){enter(method,story);beat(n,action,story,'City entered. Quest complete.',dialogue)}
function npcMenus(card,n){const menu=(name,opts)=>show(card,opts,n.name,name);
 const observe=(deep=false)=>{const descriptions={Guard:'The guard watches the entrance and checks passes.',Visitor:'A traveler carries a temporary pass.',Courier:'A courier carries sealed notes.',Infiltrator:'A figure lingers near the gate.',Trader:'A merchant waits near the entrance.',Transporter:'A transporter waits for passage.',Officer:'An officer surveys the entrance.',Worker:'A worker waits nearby.'};let detail=descriptions[n.role]||'The figure waits nearby.';if(deep)detail+=' Their manner appears '+n.trait+'.';resolve(n,deep?'Inspect':'Glance',detail,deep?'You inspect them closely.':'',deep?1:0)};
 const chat=()=>{n.trust=Math.min(1,n.trust+1);resolve(n,'Talk',n.name+' exchanges a few words with you.','Conversation ends.',1)};
 const ask=()=>menu('Ask',[['City',()=>{if(n.role==='Visitor'){s.knowledge=Math.max(2,s.knowledge);resolve(n,'Ask · City','The traveler explains how official business is verified.','City knowledge increased.',1)}else if(n.role==='Guard')resolve(n,'Ask · City','The guard points toward the entrance.','A pass is required.',0,'Show me your pass.');else resolve(n,'Ask · City',n.name+' has little to tell you about the entrance.','No new knowledge.')}],['Work',()=>{if(n.role==='Courier'&&s.errand===0)job();else resolve(n,'Ask · Work',n.name+' has no work for you.','No offer.')}]]); 
 const official=()=>{if(n.role==='Guard'&&s.knowledge>=2&&n.trust>=1)finishEntry(n,'Tell · Official business','Persuasion','The guard accepts your explanation and steps aside.');else resolve(n,'Tell · Official business',n.name+' listens but is not convinced.','No permission granted.',1)};
 const tell=()=>menu('Tell',[['City',()=>resolve(n,'Tell · City',n.name+' listens to what you know about the city.','')],['Official business',official]]);
 const threat=physical=>{n.trust=Math.max(-2,n.trust-1);if(physical)s.heat++;resolve(n,physical?'Force · Threaten':'Talk · Threaten',n.name+' stiffens at your threat.','Trust decreases.'+(physical?' Suspicion increases.':''),1)};
 const beg=()=>resolve(n,'Talk · Beg',n.name+' listens to your plea.','No agreement yet.',1);
 const gift=()=>menu('Gift',[['Money (1)',()=>{if(s.money<1)return resolve(n,'Gift','You have nothing to give.','No gift.');s.money--;n.trust=Math.min(1,n.trust+1);resolve(n,'Gift',n.name+' accepts your gift.','Money −1. Trust improves.')}]]); 
 function job(){if(s.errand!==0)return resolve(n,'Trade','The courier has no more work.','No offer.');s.errand=1;resolve(n,'Trade · Accept','The courier hands you a sealed note.','Quest: Deliver the note to the guard.',0,'Bring this to the guard.')}
 function pass(){if(!s.pass)return resolve(n,'Offer · Pass','You have no temporary pass to offer.','No agreement.');s.pass=false;finishEntry(n,'Offer · Pass','Permission','The guard examines your pass and lets you through.')}
 function note(){if(s.errand!==1)return resolve(n,'Offer · Note','You have no note to deliver.','No agreement.');s.errand=2;s.pass=true;resolve(n,'Offer · Note','The guard accepts the sealed note.','Temporary pass received.',1)}
 function bribe(method){if(s.money<6)return resolve(n,'Offer · Money','You cannot afford the offer.','No agreement.');if(method==='Threaten'){n.trust=Math.max(-2,n.trust-1);s.heat++}if(n.trait==='cautious') {s.heat++;return resolve(n,'Offer · '+(method||'Money'),'The guard refuses your money.','Offer refused. Suspicion increases.',1,'Keep your money.')}s.money-=6;finishEntry(n,'Offer · '+(method||'Money'),'Bribery','The guard pockets the money and lets you through.')}
 function uniform(){if(s.money<8||s.uniform)return resolve(n,'Trade · Uniform','The deal cannot be completed.','No agreement.');s.money-=8;const inv=invState();s.uniform=true;inv.worn=null;resolve(n,'Trade · Uniform','The seller hands you a guard uniform.','Money −8. Uniform acquired.')}
 const offers=()=>{let list=[];if(n.role==='Courier'&&s.errand===0)list.push(['Deliver a note',job]);if(n.role==='Infiltrator'&&!s.uniform)list.push(['Uniform · 8',uniform]);if(n.role==='Guard')list.push(['Entry · Pass required',pass]);if(list.length)menu('Offers',list);else resolve(n,'Trade',n.name+' has nothing to offer right now.','No offers.')};
 const offerItem=(label,fn)=>menu(label,[['Offer',()=>fn(''),()=>menu('Offer',[['Threaten',()=>fn('Threaten')],['Beg',()=>fn('Beg')]])]]);
 const playerOffer=()=>{const no=method=>{if(method==='Threaten'){n.trust=Math.max(-2,n.trust-1);s.heat++}resolve(n,'Offer'+(method?' · '+method:''),n.name+' declines your proposal.','No agreement.',1)};let list=[['Money (6)',()=>offerItem('Money (6)',n.role==='Guard'?bribe:no)]];if(n.role==='Guard'){if(s.pass)list.push(['Temporary pass',()=>offerItem('Temporary pass',pass)]);if(s.errand===1)list.push(['Sealed note',()=>offerItem('Sealed note',note)]);if(s.uniform&&invState().worn==='uniform')list.push(['Official uniform',()=>offerItem('Official uniform',()=>finishEntry(n,'Offer · Uniform','Disguise','The guard recognizes the uniform and lets you pass.'))])}menu('Make an offer',list)};

// NPC controls share one provisional outcome resolver. A failed request never moves/removes the NPC.
function npcIntent(n,intent,method,target=null,after=false){

 const ok=method==='Force'||(method==='Threaten'&&n.trait!=='cautious')||n.trust>0||(n.role!=='Guard'&&n.trait==='friendly'&&(method==='Request'||method==='Beg'));
 if(method==='Force'||method==='Threaten'){s.heat++;n.trust=Math.max(-2,n.trust-1)}
 if(!ok)return resolve(n,action,n.name+' refuses your request.','No change.'+((method==='Force'||method==='Threaten')?' Trust decreases. Suspicion increases.':''),1);
 const consequence=(method==='Force'||method==='Threaten')?' Trust decreases. Suspicion increases.':'';
 if(intent==='dismiss'){s.npcs=s.npcs.filter(x=>x!==n);return resolve(n,action,n.name+' steps away.','Leaves.'+consequence,1)}
 if(intent==='pin'){n.pinned=!n.pinned;return resolve(n,action,n.name+(n.pinned?' stays where they are.':' is free to leave.'),(n.pinned?'Stays.':'Released.')+consequence,1)}
 if(intent==='move'&&target!==n&&s.npcs.includes(target)){s.npcs=s.npcs.filter(x=>x!==n);s.npcs.splice(s.npcs.indexOf(target)+(after?1:0),0,n);return resolve(n,action,n.name+' moves to the requested position.','Moves.'+consequence,1)}
}
function intentOptions(n,intent,target=null,after=false){return ['Threaten','Beg','Force'].map(method=>[method,()=>npcIntent(n,intent,method,target,after)])}
