let menu,anchor,feedbackTimer;function close(){menu?.remove();menu=null;anchor?.classList.remove('menu-anchor');anchor=null}function feedback(msg){clearTimeout(feedbackTimer);document.querySelector('.feedback')?.remove();const el=document.createElement('div');el.className='feedback'+(s.stage<2?' intro-feedback':'');el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.textContent=msg;document.body.append(el);feedbackTimer=setTimeout(()=>el.remove(),3800)}// One gesture grammar for actionable leaves and branches. Native scroll and grip drag remain separate.

function show(b,opts,title,subtitle){
 close();const card=b.closest('.npc-card');title=title||b.dataset.menuTitle||(card?card._npc.name:b.id==='more'?'Menu':b.id==='time'?'Time':b.id==='location'?currentPlace().label:b.classList.contains('destination')?b.textContent.trim():b.textContent.trim()||'Actions');

}

 const threat=physical=>{n.trust=Math.max(-2,n.trust-1);if(physical)s.heat++;resolve(n,physical?'Force · Threaten':'Talk · Threaten',n.name+' stiffens at your threat.','Trust decreases.'+(physical?' Suspicion increases.':''),1)};
 const beg=()=>resolve(n,'Talk · Beg',n.name+' listens to your plea.','No agreement yet.',1);
 const gift=()=>menu('Gift',[['Money (1)',()=>{if(s.money<1)return resolve(n,'Gift','You have nothing to give.','No gift.');s.money--;n.trust=Math.min(1,n.trust+1);resolve(n,'Gift',n.name+' accepts your gift.','Money −1. Trust improves.')}]]); 
 function job(){if(s.errand!==0)return resolve(n,'Trade','The courier has no more work.','No offer.');s.errand=1;resolve(n,'Trade · Accept','The courier hands you a sealed note.','Quest: Deliver the note to the guard.',0,'Bring this to the guard.')}
 function pass(){if(!s.pass)return resolve(n,'Offer · Pass','You have no temporary pass to offer.','No agreement.');s.pass=false;finishEntry(n,'Offer · Pass','Permission','The guard examines your pass and lets you through.')}
 function note(){if(s.errand!==1)return resolve(n,'Offer · Note','You have no note to deliver.','No agreement.');s.errand=2;s.pass=true;resolve(n,'Offer · Note','The guard accepts the sealed note.','Temporary pass received.',1)}
 function bribe(method){if(s.money<6)return resolve(n,'Offer · Money','You cannot afford the offer.','No agreement.');if(method==='Threaten'){n.trust=Math.max(-2,n.trust-1);s.heat++}if(n.trait==='cautious') {s.heat++;return resolve(n,'Offer · '+(method||'Money'),'The guard refuses your money.','Offer refused. Suspicion increases.',1,'Keep your money.')}s.money-=6;finishEntry(n,'Offer · '+(method||'Money'),'Bribery','The guard pockets the money and lets you through.')}
 function uniform(){if(s.money<8||s.uniform)return resolve(n,'Trade · Uniform','The deal cannot be completed.','No agreement.');s.money-=8;const inv=invState();s.uniform=true;inv.worn=null;resolve(n,'Trade · Uniform','The seller hands you a guard uniform.','Money −8. Uniform acquired.')}
 const offers=()=>{let list=[];if(n.role==='Courier'&&s.errand===0)list.push(['Deliver a note',job]);if(n.role==='Infiltrator'&&!s.uniform)list.push(['Uniform · 8',uniform]);if(n.role==='Guard')list.push(['Entry · Pass required',pass]);if(list.length)menu('Offers',list);else resolve(n,'Trade',n.name+' has nothing to offer right now.','No offers.')};
 const offerItem=(label,fn)=>menu(label,[['Offer',()=>fn(''),()=>menu('Offer',[['Threaten',()=>fn('Threaten')],['Beg',()=>fn('Beg')]])]]);
 const playerOffer=()=>{const no=method=>{if(method==='Threaten'){n.trust=Math.max(-2,n.trust-1);s.heat++}resolve(n,'Offer'+(method?' · '+method:''),n.name+' declines your proposal.','No agreement.',1)};let list=[['Money (6)',()=>offerItem('Money (6)',n.role==='Guard'?bribe:no)]];if(n.role==='Guard'){if(s.pass)list.push(['Temporary pass',()=>offerItem('Temporary pass',pass)]);if(s.errand===1)list.push(['Sealed note',()=>offerItem('Sealed note',note)]);if(s.uniform&&invState().worn==='uniform')list.push(['Official uniform',()=>offerItem('Official uniform',()=>finishEntry(n,'Offer · Uniform','Disguise','The guard recognizes the uniform and lets you pass.'))])}menu('Make an offer',list)};
 const steal=()=>{if(n.role!=='Visitor'||s.pass)return resolve(n,'Steal','You find nothing useful to take.','Nothing acquired.');if(!night()&&n.trait==='cautious'){s.heat++;return resolve(n,'Steal','The traveler notices your hand.','Failed. Suspicion increases.',1)}s.pass=true;s.heat++;resolve(n,'Steal','You slip the temporary pass from the traveler’s pouch.','Temporary pass acquired. Suspicion increases.',1)};
 const violence=kill=>{s.heat++;n.trust=-2;if(kill){if(n.role==='Guard'||n.role==='Officer'){return resolve(n,'Kill',n.name+' resists your attack.','Attack fails. Suspicion increases.',1)}s.npcs=s.npcs.filter(x=>x!==n);return resolve(n,'Kill','You strike a fatal blow.','NPC removed. Suspicion increases.',1)}resolve(n,'Beat','You strike '+n.name+'.','Trust decreases. Suspicion increases.',1)};
 return {observe,options:[['Talk',chat,()=>menu('Talk',[['Ask',ask],['Tell',tell],['Threaten',()=>threat(false)],['Beg',beg],['Gift',gift]])],['Trade',offers,playerOffer],['Force',()=>threat(true),()=>menu('Force',[['Threaten',()=>threat(true)],['Beat',()=>violence(false)],['Kill',()=>violence(true)],['Steal',steal]])],['Observe',()=>observe(),()=>menu('Observe',[['Glance',()=>observe()],['Inspect',()=>observe(true)]])]]};
}
// NPC controls share one provisional outcome resolver. A failed request never moves/removes the NPC.
function npcIntent(n,intent,method,target=null,after=false){
 if(!s.npcs.includes(n))return;
 const action=(intent==='dismiss'?'Leave':intent==='pin'?(n.pinned?'Release':'Stay'):'Move')+' · '+method;
 const ok=method==='Force'||(method==='Threaten'&&n.trait!=='cautious')||n.trust>0||(n.role!=='Guard'&&n.trait==='friendly'&&(method==='Request'||method==='Beg'));
 if(method==='Force'||method==='Threaten'){s.heat++;n.trust=Math.max(-2,n.trust-1)}
 if(!ok)return resolve(n,action,n.name+' refuses your request.','No change.'+((method==='Force'||method==='Threaten')?' Trust decreases. Suspicion increases.':''),1);
 const consequence=(method==='Force'||method==='Threaten')?' Trust decreases. Suspicion increases.':'';
 if(intent==='dismiss'){s.npcs=s.npcs.filter(x=>x!==n);return resolve(n,action,n.name+' steps away.','Leaves.'+consequence,1)}
 if(intent==='pin'){n.pinned=!n.pinned;return resolve(n,action,n.name+(n.pinned?' stays where they are.':' is free to leave.'),(n.pinned?'Stays.':'Released.')+consequence,1)}
 if(intent==='move'&&target!==n&&s.npcs.includes(target)){s.npcs=s.npcs.filter(x=>x!==n);s.npcs.splice(s.npcs.indexOf(target)+(after?1:0),0,n);return resolve(n,action,n.name+' moves to the requested position.','Moves.'+consequence,1)}
}
function intentOptions(n,intent,target=null,after=false){return ['Threaten','Beg','Force'].map(method=>[method,()=>npcIntent(n,intent,method,target,after)])}
function bindNPC(card,n,options,tap){
 const grip=card.querySelector('.npc-grip');let pointer=null,timer=null,origin=null,held=false,ignoreClick=false,drag=null;
 const excluded=e=>e.target.closest('.npc-tools,.npc-grip');
 function cancelHold(){clearTimeout(timer);timer=null;pointer=null;origin=null}
 card.addEventListener('pointerdown',e=>{if(excluded(e)||e.button!==0)return;close();cancelHold();ignoreClick=false;held=false;pointer=e.pointerId;origin={x:e.clientX,y:e.clientY};if(e.pointerType!=='mouse')timer=setTimeout(()=>{held=true;ignoreClick=true;show(card,options)},450)});
 card.addEventListener('pointermove',e=>{if(pointer!==e.pointerId||!origin)return;if(Math.hypot(e.clientX-origin.x,e.clientY-origin.y)>12&&!held){ignoreClick=true;cancelHold()}});
 for(const ev of ['pointerup','pointercancel','pointerleave'])card.addEventListener(ev,e=>{if(pointer===e.pointerId)cancelHold()});
 card.addEventListener('contextmenu',e=>{if(excluded(e))return;e.preventDefault();cancelHold();ignoreClick=true;show(card,options)});
 card.addEventListener('click',e=>{if(excluded(e))return;if(ignoreClick){ignoreClick=false;return}tap()});
 card.addEventListener('keydown',e=>{if(e.target!==card)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}else if(e.key==='ArrowUp'||e.key==='ContextMenu'){e.preventDefault();show(card,options)}});
 function clearMark(){document.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'))}
 function locate(x,y){clearMark();const other=document.elementFromPoint(x,y)?.closest('.npc-card');if(!other||other===card)return null;const r=other.getBoundingClientRect(),after=y>r.top+r.height/2;other.classList.add(after?'drop-after':'drop-before');return {npc:other._npc,after}}
 function finish(e,commit){if(!drag||e.pointerId!==drag.id)return;const d=drag,target=commit&&d.active?locate(e.clientX,e.clientY):null;drag=null;clearTimeout(d.timer);clearMark();d.ghost?.remove();card.classList.remove('dragging');grip.classList.remove('alt-move');if(grip.hasPointerCapture(d.id))grip.releasePointerCapture(d.id);if(target){if(d.alternative)show(card,intentOptions(n,'move',target.npc,target.after),n.name,'Move');else npcIntent(n,'move','Request',target.npc,target.after)}else if(d.active&&commit)feedback('Choose another position to move '+n.name+'.')}
 grip.addEventListener('pointerdown',e=>{if(drag||!(e.button===0||(e.pointerType==='mouse'&&e.button===2)))return;e.preventDefault();e.stopPropagation();close();cancelHold();const r=card.getBoundingClientRect();const d={id:e.pointerId,x:e.clientX,y:e.clientY,dx:e.clientX-r.left,dy:e.clientY-r.top,active:false,ghost:null,width:r.width,alternative:e.button===2,timer:null};drag=d;if(d.alternative)grip.classList.add('alt-move');if(e.pointerType!=='mouse')d.timer=setTimeout(()=>{if(drag!==d||d.active)return;d.alternative=true;grip.classList.add('alt-move');try{navigator.vibrate?.(20)}catch{}},450);grip.setPointerCapture(e.pointerId)});
 grip.addEventListener('pointermove',e=>{if(!drag||e.pointerId!==drag.id)return;e.preventDefault();if(!drag.active&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<5)return;if(!drag.active){clearTimeout(drag.timer);drag.active=true;const ghost=card.cloneNode(true);ghost.classList.add('drag-ghost');ghost.classList.remove('dragging');ghost.style.width=drag.width+'px';ghost.setAttribute('aria-hidden','true');ghost.querySelectorAll('[tabindex],button').forEach(el=>el.tabIndex=-1);document.body.append(ghost);drag.ghost=ghost;card.classList.add('dragging')}drag.ghost.style.left=(e.clientX-drag.dx)+'px';drag.ghost.style.top=(e.clientY-drag.dy)+'px';locate(e.clientX,e.clientY)});
 grip.addEventListener('pointerup',e=>finish(e,true));grip.addEventListener('pointercancel',e=>finish(e,false));grip.addEventListener('lostpointercapture',e=>finish(e,false));
 grip.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation()});grip.addEventListener('click',e=>{e.preventDefault();e.stopPropagation()});
}
// Inventory adapts the current Gate state instead of duplicating possession quantities.
function invState(){if(!s.inventory)s.inventory={tab:'Item',visibility:{},held:null,worn:s.uniform?'uniform':null,memory:[]};const v=s.inventory;v.visibility??={};v.memory??=[];if(!['Item','Memory','Record'].includes(v.tab))v.tab='Item';return v}
function itemRows(){return []}
function memoryRows(){return []}
function recordRows(){return []}
function invRefresh(){save();render()}
function invDetail(obj,context,content,outcome=''){beat({name:obj.name},context,content,outcome)}
function invEquip(item,slot){const v=invState();if(slot==='worn'&&!item.wearable)return invDetail(item,'Wear','This item cannot be worn.','No change.');if(!itemRows().some(x=>x.id===item.id))return invDetail(item,'Item','You no longer possess this item.');v[slot]=item.id;const other=slot==='held'?'worn':'held';if(v[other]===item.id&&item.qty===1)v[other]=null;invRefresh()}
function invConsume(item){if(!item.consumable)return invDetail(item,'Consume','This item cannot be consumed.','No change.');}
function invUse(item){const action=item.wearable?'Wear':item.consumable?'Consume':'Hold';invDetail(item,'Item',action+'?');const panel=document.querySelector('.beat-panel');const controls=document.createElement('div');controls.style.cssText='display:flex;gap:8px;justify-content:flex-end;margin-top:16px';button(controls,'Cancel',closeBeat);button(controls,action,()=>{closeBeat();if(action==='Wear')invEquip(item,'worn');else if(action==='Consume')invConsume(item);else invEquip(item,'held')});panel.append(controls)}
function invSlot(anchor,slot){const rows=itemRows().filter(x=>slot==='held'||x.wearable);show(anchor,[['None',()=>{invState()[slot]=null;invRefresh()}],...rows.map(x=>[x.name,()=>invEquip(x,slot)])],slot==='held'?'Hold':'Wear','Select Item')}
function invResolveMemory(obj){if(obj.cut)return invDetail(obj,'Memory',obj.content||'This knowledge was rejected.','Cut. Not active.');if(!obj.conflict)return invDetail(obj,'Memory',obj.content||'','Level '+obj.level);
 invDetail(obj,'Conflicting Knowledge','Choose the version you believe.');const panel=document.querySelector('.beat-panel');
 for(const [index,version] of (obj.versions||[]).entries()){const row=document.createElement('div');row.className='memory-choice';const p=document.createElement('div');p.textContent=version.content;row.append(p);button(row,'Believe',()=>{const selected=obj.versions[index];const rejected=obj.versions.filter((_,i)=>i!==index).map((x,i)=>({...x,id:obj.id+'-cut-'+(x.id||i),name:x.name||obj.name,cut:true,conflict:false,level:x.level??obj.level}));Object.assign(obj,{content:selected.content,level:selected.level??obj.level,conflict:false,versions:undefined});invState().memory.push(...rejected);closeBeat();invRefresh();invResolveMemory(obj)});panel.append(row)}
}
function invRecord(obj){invDetail(obj,'Record','Progress: '+obj.steps.filter(x=>x.done).length+'/'+obj.steps.length);const panel=document.querySelector('.beat-panel');for(const step of obj.steps){const row=document.createElement('div');row.className='record-step'+(step.done?' done':'');row.textContent=(step.done?'✓  ':'○  ')+step.label;panel.append(row)}}
function renderInventory(c){const v=invState();const items=itemRows();for(const slot of ['held','worn'])if(v[slot]&&!items.some(x=>x.id===v[slot]))v[slot]=null;
 const tabs=document.createElement('div');tabs.className='inventory-tabs';c.append(tabs);for(const tab of ['Item','Memory','Record']){const a=button(tabs,tab,()=>{v.tab=tab;invRefresh()});if(v.tab===tab)a.classList.add('active')}
 if(v.tab==='Item'){const slots=document.createElement('div');slots.className='equip-slots';c.append(slots);for(const [slot,label] of [['held','Hold'],['worn','Wear']]){const a=document.createElement('button');a.className='equip-slot';const small=document.createElement('small');small.textContent=label;const name=document.createElement('strong');name.textContent=items.find(x=>x.id===v[slot])?.name||'None';a.append(small,name);gesture(a,()=>invSlot(a,slot));slots.append(a)}}
 const data=v.tab==='Item'?items:v.tab==='Memory'?memoryRows():recordRows();if(!data.length){const p=document.createElement('small');p.textContent='Nothing here yet.';c.append(p)}
 for(const obj of data){const row=document.createElement('div');row.className='inv-row';const main=document.createElement('button');main.className='inv-main'+(obj.conflict?' inv-conflict':'')+(obj.cut?' inv-cut':'');const title=document.createElement('strong');title.textContent=obj.name;const detail=document.createElement('small');detail.textContent=v.tab==='Item'?'× '+obj.qty:v.tab==='Memory'?'Lv. '+obj.level:obj.steps.filter(x=>x.done).length+'/'+obj.steps.length;main.append(title,detail);if(v.tab==='Record'){const p=document.createElement('div');p.className='inv-progress';const bar=document.createElement('span');bar.style.width=(obj.steps.filter(x=>x.done).length/obj.steps.length*100)+'%';p.append(bar);main.append(p)}
 const defaultAction=()=>v.tab==='Item'?invUse(obj):v.tab==='Memory'?invResolveMemory(obj):invRecord(obj);
 const opts=v.tab==='Item'?[['Hold',()=>invEquip(obj,'held')],['Wear',()=>invEquip(obj,'worn')],['Consume',()=>invConsume(obj)]]:null;
 hold(main,opts,defaultAction);
 main.dataset.menuTitle=obj.name;main.dataset.menuSubtitle='Item';const eye=document.createElement('button');eye.className='inv-eye';const k=v.tab+':'+obj.id, vis=v.visibility[k]||'Normal';eye.dataset.vis=vis;eye.dataset.menuTitle=obj.name;eye.dataset.menuSubtitle='Visibility';eye.setAttribute('aria-label',obj.name+': '+vis);eye.title=vis;
 eye.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>'+(vis==='Conceal'?'<path d="M3 3l18 18"/>':'')+'</svg>';
 const set=mode=>{v.visibility[k]=mode;invRefresh()};hold(eye,['Display','Normal','Conceal'].map(mode=>[mode,()=>set(mode)]),()=>set(vis==='Conceal'?'Normal':'Conceal'));row.append(main,eye);c.append(row)}
}

function mapIcon(kind){
 const el=document.createElement('span');
 const paths={chevron:'<path d="m9 6 6 6-6 6"/>',folder:'<path d="M3 7h7l2 2h9v10H3z"/>',open:'<path d="M3 19V5h7l2 2h9v3M3 19l4-9h14l-4 9z"/>',zone:'<rect x="4" y="4" width="16" height="16" rx="2"/><path d="M4 10h16M10 10v10"/>',secret:'<path d="M3 12s3-6 9-6 9 6 9 6-3 6-9 6-9-6-9-6zM3 3l18 18"/>',pin:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/>'};
 el.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+paths[kind]+'</svg>';
 return el.firstElementChild;
}

function renderMap(parent){
 const result=s.selection;
 const overview=document.createElement('section');overview.className='map-panel';
 const title=document.createElement('h2');title.className='map-title';title.textContent='World Selection';overview.append(title);
 const summary=document.createElement('small');summary.className='map-note';summary.textContent=result.city+' · '+result.zones.length+' Zones · '+result.locations.length+' Locations · Seed '+s.seed;overview.append(summary);
 for(const [heading,entries] of [['Zones',result.zones],['Locations',result.locations]]){
  const h=document.createElement('h2');h.className='map-title';h.textContent=heading+' ('+entries.length+')';overview.append(h);
  const list=document.createElement('div');list.className='map-tree';overview.append(list);
  entries.forEach((p,i)=>{
   const line=document.createElement('div');line.className='map-leaf';const num=document.createElement('span');num.className='map-count';num.textContent=String(i+1).padStart(2,'0');
   const body=document.createElement('div');body.className='map-leaf-label';const label=document.createElement('strong');label.textContent=p.type;const detail=document.createElement('small');detail.textContent=p.priorityFunction+' · '+p.priorityFaction;body.append(label,detail);line.append(num,body);list.append(line);
  });
 }
 const note=document.createElement('small');note.className='map-note';note.textContent='Selection only. No Geography, Placement, Site or mandatory Location in this experiment.';overview.append(note);parent.append(overview);
}
function render(){
 close();app.className='';
 if(s.stage<2){
  app.innerHTML='<div class="intro"><h1></h1><p></p><div id="controls"></div></div>';
  const h=app.querySelector('h1'),p=app.querySelector('p'),c=app.querySelector('#controls');
  if(s.stage===0){
   h.textContent='Infaction is not as it seems.';
   p.innerHTML=(matchMedia("(hover: hover) and (pointer: fine)").matches?"When nothing is left, try what's right.":"If you think you can hold, don't tap.")+'<br><br>Are you ready?';
   button(c,"I'm not ready",()=>feedback('You are not ready yet.'),[["I'm ready",()=>{s.stage=1;save();render()}]]).dataset.menuTitle='Ready?';
  }else{
   h.textContent='Welcome to Infaction';p.textContent='Your journey begins in the land of '+s.city+'.';
   button(c,"I'm out",()=>{s.stage=0;save();render()},[["I'm in",()=>{s.stage=2;s.tab='location';save();render()}],["Change city",()=>{s=fresh();s.stage=1;save();render()}]]).dataset.menuTitle='Sure?';
  }return;
 }
 app.innerHTML='<div class="location-header"><div class="location-label"><h1 id="location">World Selection</h1><span id="time"></span></div><button id="more" aria-label="Menu">⋯</button></div><div id="content"></div><nav id="nav" aria-label="Game navigation"></nav>';
 app.querySelector('#time').textContent=s.city;
 hold(app.querySelector('#location'),[],()=>feedback('Selection experiment — no travel or placement yet.'));
 const more=app.querySelector('#more');
 gesture(more,()=>show(more,[['New universe',()=>{s=fresh();s.stage=2;save();render()}],['Return to intro',()=>{s.stage=0;save();render()}]]));
 for(const tab of ['gate','location','inventory']){
  const b=button(app.querySelector('#nav'),({gate:'Interaction',location:'Location',inventory:'Inventory'})[tab],()=>{s.tab=tab;save();render()});
  const icons={gate:'<path d="M4 5h16v11H9l-5 4z"/>',location:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/>',inventory:'<rect x="4" y="7" width="16" height="14" rx="2"/><path d="M9 7V4h6v3M4 12h16"/>'};
  b.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+icons[tab]+'</svg><span>'+b.textContent+'</span>';
  if(s.tab===tab){b.className='selected';b.setAttribute('aria-current','page')}
 }
 const content=app.querySelector('#content');
 if(s.tab==='location')renderMap(content);
 else if(s.tab==='gate')content.innerHTML='<section><small>No NPCs. Interaction is intentionally empty.</small></section>';
 else content.innerHTML='<section><small>Inventory is not part of the selection experiment.</small></section>';
}document.addEventListener('pointerdown',e=>{if(menu&&!menu.contains(e.target)&&!anchor?.contains(e.target))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.beat-backdrop'))closeBeat();else close()}});window.addEventListener('resize',close);render();
