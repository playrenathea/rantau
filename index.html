function npcIntent(n,intent,method,target=null,after=false){

function render(){close();app.className=s.stage===2&&night()?'night':'';if(s.stage<2){app.innerHTML='<div class="intro"><h1></h1><p></p><div id="controls"></div></div>';let h=app.querySelector('h1'),p=app.querySelector('p'),c=app.querySelector('#controls');if(s.stage===0){h.textContent='Infaction is not as it seems.';p.innerHTML=(matchMedia("(hover: hover) and (pointer: fine)").matches?"When nothing is left, try what\u0027s right.":"If you think you can hold, don\u0027t tap.")+"<br><br>Are you ready?";button(c,"I'm not ready",()=>feedback('You are not ready yet.'),[["I'm ready",()=>{s.stage=1;save();render()}]])}else{h.textContent='Welcome to Infaction';p.textContent='Your first quest is to enter the '+s.city+'.';button(c,"I'm out",()=>{s.stage=0;save();render()},[["I'm in",()=>{s.stage=2;s.tab='gate';update('You arrive outside the city. The guard requires a pass.')}],["Change city",()=>{let next=fresh();for(let i=0;i<30&&next.city===s.city;i++)next=fresh();if(next.city===s.city)return feedback('The city remains unchanged. Try again.'); s=next;s.stage=1;save();render()}]])}return}

app.innerHTML=' <div class="location-header"><div class="location-label"><h1 id="location">City Gate</h1><span id="time">'+clock()+' · '+(night()?'Night':'Day')+'</span></div><button id="more" aria-label="Menu">⋯</button></div><section class="log">'+s.log+'</section><div id="content"></div><nav id="nav" aria-label="Game navigation"></nav>';hold(app.querySelector('#location'),[['Observe',()=>update(night()?'The shadows reach the wall. The guard watches the main entrance.':'Travelers queue under the guard’s watch.')]],()=>feedback('You are at the City Gate.'));hold(app.querySelector('#time'),[['Wait until',waitUntil]],()=>{s.hour=(s.hour+1)%24;s.heat=Math.max(0,s.heat-1);populate(s);update('An hour passes.')});for(let id of ['location','time']){let el=app.querySelector('#'+id);el.tabIndex=0;el.setAttribute('role','button')}app.querySelector('#more').onclick=()=>show(app.querySelector('#more'),[['Exit',()=>{s.stage=0;save();render()}],['New universe',()=>{if(confirm('Start a new universe?')){s=fresh();save();render()}}]]);for(let tab of ['gate','location','inventory']){let b=button(app.querySelector('#nav'),({gate:'Interaction',location:'Location',inventory:'Inventory'})[tab],()=>{s.tab=tab;save();render()});const label=b.textContent;const icons={gate:'<path d="M4 5h16v11H9l-5 4z"/>',location:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/>',inventory:'<rect x="4" y="7" width="16" height="14" rx="2"/><path d="M9 7V4h6v3M4 12h16"/>'};b.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+icons[tab]+'</svg><span>'+label+'</span>';if(s.tab===tab){b.className='selected';b.setAttribute('aria-current','page')}}let c=app.querySelector('#content');if(s.tab==='factions')s.tab='location';if(s.tab==='location'){const guardCount=s.npcs.filter(n=>n.role==='Guard').length;let sec=document.createElement('section');c.append(sec);let dest=button(sec,(guardCount?'🔒 ':'')+s.city,()=>{if(!guardCount)enter('Unguarded gate','You enter while the gate is unattended.');else feedback('The guards block your entry. A pass is required.')},[['Sneak in',()=>{if(!guardCount)return enter('Unguarded gate','You enter while the gate is unattended.');if(!night()||guardCount>=2)return update('You cannot sneak past the guards under these conditions.');s.heat++;enter('Infiltration','You slip through unseen. Your entry is unauthorized.')}]]);dest.classList.add('destination');if(guardCount)dest.classList.add('locked');return}if(s.tab==='inventory'){c.innerHTML='<section><small>ITEM</small><p>Money × '+s.money+'</p>'+(s.pass?'<p>Temporary Pass × 1</p>':'')+(s.uniform?'<p>Guard Uniform (worn)</p>':'')+'</section><section><small>KNOWLEDGE</small><p>'+s.city+' · Level '+s.knowledge+'</p></section><section><small>RECORD</small><p>Enter the City</p>'+(s.errand===1?'<p>Deliver the sealed note to the Guard.</p>':'')+'</section>';return}if(s.tab==='factions'){c.innerHTML=s.f.map(f=>'<section>'+f.name+'<br><small>'+f.types.join(' · ')+'</small></section>').join('');return}
if(!s.npcs.length)c.innerHTML='<section><small>No one is here.</small></section>';for(let n of s.npcs){let sec=document.createElement('div');sec.className='npc-card';sec.tabIndex=0;sec._npc=n;const name=document.createElement('span');name.className='npc-name';name.textContent=n.name;const tags=document.createElement('small');tags.className='npc-tags';tags.textContent=[n.role,n.faction,n.trait].join(' · ');const tools=document.createElement('div');tools.className='npc-tools';const grip=document.createElement('button');grip.type='button';grip.className='npc-grip';grip.setAttribute('aria-label','Move '+n.name);grip.title='Drag to request a move; hold or right-drag for options';grip.innerHTML='<svg viewBox="0 0 18 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="6" r="1.6"/><circle cx="12" cy="6" r="1.6"/><circle cx="6" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="6" cy="18" r="1.6"/><circle cx="12" cy="18" r="1.6"/></svg>';sec.append(grip,name,tags,tools);c.append(sec);
const observe=()=>update(n.role==='Guard'?'A watchful guard checks passes.':n.role==='Visitor'?'A temporary pass hangs from their pouch.':n.role==='Courier'?'A courier carries sealed notes.':'A figure waits nearby.');
for(const [intent,label,svg] of [['pin',n.pinned?'Release':'Pin','<path d="M16 3l5 5-4 2-3 5-2 2-5-5 2-2 5-3zM4 20l7-7"/>'],['dismiss','Dismiss','<path d="M6 6l12 12M18 6L6 18"/>']]){const control=button(tools,label,()=>npcIntent(n,intent,'Request'),intentOptions(n,intent));control.setAttribute('aria-label',label);control.title=label;control.dataset.menuTitle=n.name;control.dataset.menuSubtitle=label;control.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+svg+'</svg>';if(intent==='pin'&&n.pinned)control.classList.add('pinned');for(const ev of ['click','contextmenu','pointerdown','pointerup','keydown'])control.addEventListener(ev,e=>e.stopPropagation())}
let opts=[];if(n.role==='Guard'){opts=[['Show pass',()=>{if(!s.pass)return update('You have no pass.');s.pass=false;enter('Permission','Your temporary pass is accepted and consumed.')}],['Deliver note',()=>{if(s.errand!==1)return update('You have nothing to deliver.');s.errand=2;s.pass=true;update('The guard accepts the note and issues a temporary pass.',1)}],['Offer bribe (6)',()=>{if(s.money<6)return update('Not enough money.');if(n.trait==='cautious'){s.heat++;return update('The guard refuses the bribe.',1)}s.money-=6;enter('Bribery','The guard pockets the money and lets you through.')}],['Claim official business',()=>{if(s.knowledge>=2&&n.trust>=1)enter('Persuasion','The guard lets you enter on your word.');else update('The guard demands proof.',1)}],['Pass as guard',()=>{if(s.uniform)enter('Disguise','You enter wearing a guard uniform.');else update('You need a uniform.')}]]}else if(n.role==='Courier'){opts=[['Ask for work',()=>{if(s.errand===0){s.errand=1;update('Deliver this sealed note to the guard. You will receive a temporary pass.')}else update('The courier has no more work.')}]]}else if(n.role==='Visitor'){opts=[['Ask about the city',()=>{s.knowledge=Math.max(2,s.knowledge);update('You learn how official business is verified.',1)}],['Steal pass',()=>{if(s.pass)return update('You already have a pass.');if(!night()&&n.trait==='cautious'){s.heat++;return update('The traveler notices you.',1)}s.pass=true;s.heat++;update('You take the temporary pass.',1)}]]}else if(n.role==='Infiltrator'){opts=[['Buy uniform (8)',()=>{if(s.money<8||s.uniform)return update('No deal.');s.money-=8;s.uniform=true;update('You buy and wear a guard uniform.')}]]}bindNPC(sec,n,[['Socialize',()=>{if(n.trust<1)n.trust++;update(n.name+' exchanges a few words with you.',1)}],...opts],observe)}
}document.addEventListener('pointerdown',e=>{if(menu&&!menu.contains(e.target)&&!anchor?.contains(e.target))close()});document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});window.addEventListener('resize',close);render();
