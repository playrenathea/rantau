<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infaction</title><style>
*{box-sizing:border-box}body{margin:0;background:#efeee9;color:#252923;font:16px system-ui}main{max-width:620px;margin:auto;min-height:100dvh;background:#fcfbf7;padding:24px}h1,h2{font-family:Georgia,serif;font-weight:normal}button{font:inherit;color:inherit;background:#f5f4ee;border:1px solid #cccfc5;border-radius:8px;padding:12px;touch-action:pan-y;user-select:none;-webkit-touch-callout:none}button:focus-visible{outline:2px solid #637a64}header,nav,.stats{display:flex;justify-content:space-between;gap:8px;align-items:center}section{border-bottom:1px solid #ddd;padding:14px 0}small{color:#6b7169}.intro{min-height:85dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px}.intro p{line-height:1.7}.intro button{min-width:150px}.bubble{position:fixed;z-index:10;background:#303a32;color:white;padding:8px;border-radius:14px;box-shadow:0 4px 24px #0003;max-width:calc(100vw - 20px);display:flex;flex-wrap:wrap;gap:6px}.bubble button{background:#465548;color:white;border:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.log{font-size:14px;color:#555;min-height:60px}.night{background:#e0e4e7}.selected{background:#dce5d9}button:disabled{opacity:.5}
.location-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 12px}.location-header h1{margin:0}.location-header span{white-space:nowrap;color:#626a61;font-size:14px}#location,#time{cursor:pointer;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}#location:focus-visible,#time:focus-visible{outline:2px solid #637a64}.bubble form{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.bubble input{font:inherit;padding:8px;border-radius:6px;border:0}#more{padding:0 5px;font-size:26px;background:none;border:0;line-height:1;margin-left:0}.location-header{margin-top:0}.location-header h1{flex:1}.location-header span{margin-left:auto}nav button{flex:1}</style></head><body><main id="app"></main><script>
const app=document.querySelector('#app'),key='infaction-mvp-01';
const animals={Dragon:['Heart','Flame','Breath'],Eagle:['Nest','Eye','Wing'],Lion:['Mane','Heart','Roar'],Serpent:['Fang','Venom'],Elephant:['Tusk','Trunk'],Octopus:['Ink','Tentacle'],Whale:['Bone','Fin'],Griffin:['Talon','Wing']},bases=['Kingdom','Republic','Empire','Court','Ministry'],names=['Mara','Rafael','Dewi','Ken','Aisha','Diego','Pablo','Nadia','Iris','Omar','Soren','Lea'],types=['Military','Religious','Merchant','Criminal','Conspiracy','Clan','Cultural','Outsider','Academic'];
const pick=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function populate(state){const dark=state.hour>=19||state.hour<6;const r=Math.random(),guards=r<.02?0:r<.72?1:2,others=dark?(Math.random()<.5?0:1):(Math.random()<.5?2:3);const roles=Array(guards).fill('Guard').concat(shuffle(dark?['Smuggler','Traveler','Courier']:['Courier','Traveler','Worker','Merchant']).slice(0,others));const pool=shuffle(names);state.npcs=roles.map((role,i)=>({role,name:pool[i],faction:role==='Guard'?state.f.find(f=>f.type==='Government').name:pick(state.f.filter(f=>f.type!=='Government')).name,trust:0,trait:pick(['cautious','pragmatic','friendly'])}));return state}function fresh(){let aa=shuffle(Object.keys(animals)),nn=shuffle(names),animal=aa[0],f=[{name:animal+' '+pick(bases),type:'Government'},{name:aa[1]+' Front',type:'Revolutionary'},...shuffle(types).slice(0,4).map((t,i)=>({name:aa[i+2]+' '+['Order','Union','Circle','Company'][i],type:t}))];return populate({stage:0,city:animal+"'s "+pick(animals[animal])+' City',f,npcs:['Guard','Courier','Traveler','Smuggler'].map((role,i)=>({role,name:nn[i],faction:role==='Guard'?f[0].name:f[i+1].name,trust:0,trait:pick(['cautious','pragmatic','friendly'])})),hour:17,money:10,pass:false,uniform:false,knowledge:1,errand:0,heat:0,log:'',tab:'gate',outcome:''})}
let s;try{s=JSON.parse(localStorage.getItem(key))||fresh()}catch(e){s=fresh()}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}
let menu;function close(){menu?.remove();menu=null}function hold(button,options,tap){let timer,held=false,x,y;button.onpointerdown=e=>{close();held=false;x=e.clientX;y=e.clientY;timer=setTimeout(()=>{held=true;show(button,options)},450)};button.onpointermove=e=>{if(Math.abs(e.clientX-x)+Math.abs(e.clientY-y)>12)clearTimeout(timer)};button.onpointerup=button.onpointercancel=button.onpointerleave=()=>clearTimeout(timer);button.oncontextmenu=e=>{e.preventDefault();held=true;show(button,options)};button.onclick=()=>{if(!held)tap();held=false};button.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ContextMenu'){e.preventDefault();show(button,options)}}}
function show(b,opts){close();menu=document.createElement('div');menu.className='bubble';for(let [label,fn] of opts){let a=document.createElement('button');a.textContent=label;a.onclick=e=>{e.stopPropagation();close();fn()};menu.append(a)}document.body.append(menu);let r=b.getBoundingClientRect();menu.style.left=Math.max(10,Math.min(r.left,innerWidth-menu.offsetWidth-10))+'px';menu.style.top=(r.top>menu.offsetHeight+18?r.top-menu.offsetHeight-8:r.bottom+8)+'px'}
function button(parent,label,tap,opts=[]){let b=document.createElement('button');b.textContent=label;parent.append(b);if(opts.length)hold(b,opts,tap);else b.onclick=tap;return b}
function update(msg,hours=0){s.log=msg;s.hour=((s.hour+hours)%24+24)%24;save();render()}function enter(method,detail){s.stage=3;s.outcome=method;s.log=detail;save();render()}const night=()=>s.hour>=19||s.hour<6;const clock=()=>{let m=Math.round(s.hour*60)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};function waitUntil(){close();let panel=document.createElement('div');panel.className='bubble';panel.style.left='50%';panel.style.top='32%';panel.style.transform='translateX(-50%)';let form=document.createElement('form');form.innerHTML='<label for="target-time">Wait until</label><input id="target-time" type="time" required><button type="submit">Wait</button><button type="button" id="cancel-wait">Cancel</button>';panel.append(form);document.body.append(panel);menu=panel;let input=form.querySelector('input');input.value=clock();form.querySelector('#cancel-wait').onclick=close;form.onsubmit=e=>{e.preventDefault();if(!input.value)return;let [h,m]=input.value.split(':').map(Number),target=h+m/60,elapsed=(Math.round(target*60)-Math.round(s.hour*60)+1440)%1440;if(!elapsed)elapsed=1440;s.heat=Math.max(0,s.heat-Math.floor(elapsed/60));s.hour=target;populate(s);update('You wait until '+clock()+'.')};}
function render(){close();app.className=s.stage===2&&night()?'night':'';if(s.stage<2){app.innerHTML='<div class="intro"><h1></h1><p></p><div id="controls"></div></div>';let h=app.querySelector('h1'),p=app.querySelector('p'),c=app.querySelector('#controls');if(s.stage===0){h.textContent='Infaction is not as it seems.';p.innerHTML="But if you think you can hold, don't tap.<br><br>Are you ready?";button(c,"I'm not ready",()=>{},[["I'm ready",()=>{s.stage=1;save();render()}]])}else{h.textContent='Welcome to Infaction';p.textContent='Your first quest is to enter the '+s.city+'.';button(c,"I'm out",()=>{s.stage=0;save();render()},[["I'm in",()=>{s.stage=2;s.tab='gate';update('You arrive outside the city. The guard requires a pass.')}],["Change city",()=>{let next=fresh();for(let i=0;i<30&&next.city===s.city;i++)next=fresh();if(next.city===s.city)return; s=next;s.stage=1;save();render()}]])}return}
if(s.stage===3){app.innerHTML='<div class="intro"><small>QUEST COMPLETE</small><h1>'+s.city+'</h1><p>Entry: '+s.outcome+'</p><p>'+s.log+'</p><small>Money: '+s.money+' · Suspicion: '+s.heat+'</small><div id="controls"></div></div>';button(app.querySelector('#controls'),'New universe',()=>{s=fresh();save();render()});return}
app.innerHTML=' <div class="location-header"><h1 id="location">City Gate</h1><span id="time">'+clock()+' · '+(night()?'Night':'Day')+'</span><button id="more" aria-label="Menu">⋯</button></div><nav id="nav"></nav><section class="log">'+s.log+'</section><div id="content"></div>';hold(app.querySelector('#location'),[['Observe',()=>update(night()?'The shadows reach the wall. The guard watches the main entrance.':'Travelers queue under the guard’s watch.')],['Slip through shadows',()=>{if(!s.npcs.some(n=>n.role==='Guard'))return enter('Unguarded gate','You enter while the gate is unattended.');if(!night())return update('Too exposed in daylight.',1);if(s.heat>=2)return update('The guard is alert. Wait for suspicion to fall.',1);s.heat++;enter('Infiltration','You slip through unseen. Your entry is unauthorized.')}]],()=>{});hold(app.querySelector('#time'),[['Wait until',waitUntil]],()=>{});for(let id of ['location','time']){let el=app.querySelector('#'+id);el.tabIndex=0;el.setAttribute('role','button')}app.querySelector('#more').onclick=()=>show(app.querySelector('#more'),[['Exit',()=>{s.stage=0;save();render()}],['New universe',()=>{if(confirm('Start a new universe?')){s=fresh();save();render()}}]]);for(let tab of ['gate','location','inventory']){let b=button(app.querySelector('#nav'),({gate:'Interaction',location:'Location',inventory:'Inventory'})[tab],()=>{s.tab=tab;save();render()});if(s.tab===tab)b.className='selected'}let c=app.querySelector('#content');if(s.tab==='factions')s.tab='location';if(s.tab==='location'){c.innerHTML='<section><strong>City Gate</strong><br><small>Current location</small></section><section><small>FACTIONS · MVP DEBUG</small>'+s.f.map(f=>'<p>'+f.name+'<br><small>'+f.type+'</small></p>').join('')+'</section>';return}if(s.tab==='inventory'){c.innerHTML='<section><small>ITEM</small><p>Money × '+s.money+'</p>'+(s.pass?'<p>Temporary Pass × 1</p>':'')+(s.uniform?'<p>Guard Uniform (worn)</p>':'')+'</section><section><small>KNOWLEDGE</small><p>'+s.city+' · Level '+s.knowledge+'</p></section><section><small>RECORD</small><p>Enter the City</p>'+(s.errand===1?'<p>Deliver the sealed note to the Guard.</p>':'')+'</section>';return}if(s.tab==='factions'){c.innerHTML=s.f.map(f=>'<section>'+f.name+'<br><small>'+f.type+'</small></section>').join('');return}
if(!s.npcs.length)c.innerHTML='<section><small>No one is here.</small></section>';for(let n of s.npcs){let sec=document.createElement('section');sec.innerHTML='<strong>'+n.name+'</strong> <small>· '+n.role+'</small><br><small>'+n.faction+' · '+n.trait+'</small>';let acts=document.createElement('div');acts.className='actions';sec.append(acts);c.append(sec);button(acts,'Observe',()=>update(n.role==='Guard'?'A watchful guard checks passes.':n.role==='Traveler'?'A temporary pass hangs from their pouch.':n.role==='Courier'?'A courier carries sealed notes.':'A figure waits in the shadows.'));let opts=[];if(n.role==='Guard'){opts=[['Show pass',()=>{if(!s.pass)return update('You have no pass.');s.pass=false;enter('Permission','Your temporary pass is accepted and consumed.')}],['Deliver note',()=>{if(s.errand!==1)return update('You have nothing to deliver.');s.errand=2;s.pass=true;update('The guard accepts the note and issues a temporary pass.',1)}],['Offer bribe (6)',()=>{if(s.money<6)return update('Not enough money.');if(n.trait==='cautious'){s.heat++;return update('The guard refuses the bribe.',1)}s.money-=6;enter('Bribery','The guard pockets the money and lets you through.')}],['Claim official business',()=>{if(s.knowledge>=2&&n.trust>=1)enter('Persuasion','The guard lets you enter on your word.');else update('The guard demands proof.',1)}],['Pass as guard',()=>{if(s.uniform)enter('Disguise','You enter wearing a guard uniform.');else update('You need a uniform.')}]]}else if(n.role==='Courier'){opts=[['Ask for work',()=>{if(s.errand===0){s.errand=1;update('Deliver this sealed note to the guard. You will receive a temporary pass.')}else update('The courier has no more work.')}]]}else if(n.role==='Traveler'){opts=[['Ask about the city',()=>{s.knowledge=Math.max(2,s.knowledge);update('You learn how official business is verified.',1)}],['Steal pass',()=>{if(s.pass)return update('You already have a pass.');if(!night()&&n.trait==='cautious'){s.heat++;return update('The traveler notices you.',1)}s.pass=true;s.heat++;update('You take the temporary pass.',1)}]]}else if(n.role==='Smuggler'){opts=[['Buy uniform (8)',()=>{if(s.money<8||s.uniform)return update('No deal.');s.money-=8;s.uniform=true;update('You buy and wear a guard uniform.')}]]}button(acts,'Socialize',()=>{if(n.trust<1)n.trust++;update(n.name+' exchanges a few words with you.',1)},opts)}
}document.addEventListener('pointerdown',e=>{if(menu&&!menu.contains(e.target)&&e.target.tagName!=='BUTTON'&&!e.target.closest('#location,#time'))close()});render();
</script></body></html>
