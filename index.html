<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Infaction</title><style>
*{box-sizing:border-box}body{margin:0;background:#efeee9;color:#252923;font:16px system-ui}main{max-width:620px;margin:auto;min-height:100dvh;background:#fcfbf7;padding:24px}h1,h2{font-family:Georgia,serif;font-weight:normal}button{font:inherit;color:inherit;background:#f5f4ee;border:1px solid #cccfc5;border-radius:8px;padding:12px;touch-action:pan-y;user-select:none;-webkit-touch-callout:none}button:focus-visible{outline:2px solid #637a64}header,nav,.stats{display:flex;justify-content:space-between;gap:8px;align-items:center}section{border-bottom:1px solid #ddd;padding:14px 0}small{color:#6b7169}.intro{min-height:85dvh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:16px}.intro p{line-height:1.7}.intro button{min-width:150px}.bubble{position:fixed;z-index:10;background:#303a32;color:white;padding:8px;border-radius:14px;box-shadow:0 4px 24px #0003;max-width:calc(100vw - 20px);display:flex;flex-wrap:wrap;gap:6px}.bubble button{background:#465548;color:white;border:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}.log{font-size:14px;color:#555;min-height:60px}.night{background:#e0e4e7}.selected{background:#dce5d9}button:disabled{opacity:.5}
.location-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:24px 0 12px}.location-header h1{margin:0}.location-header span{white-space:nowrap;color:#626a61;font-size:14px}#location,#time{cursor:pointer;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}#location:focus-visible,#time:focus-visible{outline:2px solid #637a64}.bubble form{display:flex;flex-wrap:wrap;align-items:center;gap:8px}.bubble input{font:inherit;padding:8px;border-radius:6px;border:0}#more{padding:0 5px;font-size:26px;background:none;border:0;line-height:1;margin-left:0}.location-header{margin-top:0}.location-header h1{flex:1}.location-header span{margin-left:auto}nav button{flex:1}.location-header{align-items:flex-start}.location-label{display:flex;flex-direction:column;gap:6px;flex:1}.location-label #time{margin-left:0;align-self:flex-start}.destination{width:100%;text-align:left}.destination.locked{color:#777;background:transparent}main:has(#nav){padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}#nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:620px;z-index:5;background:#fcfbf7;border-top:1px solid #dedfd6;display:flex;gap:0;padding:6px 12px calc(6px + env(safe-area-inset-bottom,0px))}#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:transparent;border:0;border-radius:8px;padding:7px 2px;font-size:12px;color:#777e75}#nav button.selected{color:#253d2c;font-weight:600}#nav button.selected svg{stroke-width:2.2}.npc-card{position:relative;padding:15px 12px;margin:8px 0;border:1px solid #dbddd4;border-radius:9px;background:#fcfbf7;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:pointer}.npc-card:focus-visible{outline:2px solid #637a64}.npc-name{display:block;padding-right:88px;font-weight:600}.npc-tags{display:block;margin-top:5px;font-size:12px;line-height:1.5;padding-right:5px}.npc-tools{position:absolute;right:6px;top:6px;display:flex;gap:3px}.npc-tools button{border:0;background:transparent;padding:7px;line-height:1;color:#788077}.npc-tools button.pinned{color:#253d2c;background:#dce5d9}.npc-tools svg{width:17px;height:17px;display:block}.npc-card.dragging{opacity:.45}.npc-card.drop-before{border-top:3px solid #637a64}.npc-card.drop-after{border-bottom:3px solid #637a64}.drag-ghost{position:fixed;z-index:11;pointer-events:none;opacity:.92;max-width:calc(100vw - 24px);box-shadow:0 5px 20px #0002}
</style></head><body><main id="app"></main><script src="world-generator.js"></script><script>
const app=document.querySelector('#app'),key='infaction-mvp-01';
const names=['Mara','Rafael','Dewi','Ken','Aisha','Diego','Pablo','Nadia','Iris','Omar','Soren','Lea'];
const pick=a=>a[Math.floor(Math.random()*a.length)],shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function populate(state){const dark=state.hour>=19||state.hour<6;const r=Math.random(),guards=r<.02?0:r<.72?1:2,others=dark?(Math.random()<.5?0:1):(Math.random()<.5?2:3);const roles=Array(guards).fill('Guard').concat(shuffle(dark?['Smuggler','Traveler','Courier']:['Courier','Traveler','Worker','Merchant']).slice(0,others));const pool=shuffle(names);const pinned=(state.npcs||[]).filter(n=>n.pinned);const remaining=[...roles];for(const n of pinned){const i=remaining.indexOf(n.role);if(i>=0)remaining.splice(i,1);else{const j=remaining.findIndex(r=>(r==='Guard')===(n.role==='Guard'));if(j>=0)remaining.splice(j,1)}}const available=pool.filter(name=>!pinned.some(n=>n.name===name));state.npcs=pinned.concat(remaining.map((role,i)=>({role,name:available[i],faction:role==='Guard'?state.f.find(f=>f.types.includes('Government')).name:pick(state.f.filter(f=>!f.types.includes('Government'))).name,trust:0,trait:pick(['cautious','pragmatic','friendly'])})));return state}function fresh(){const w=InfactionWorld.generate();return populate({stage:0,worldVersion:w.version,city:w.city,f:w.factions,hour:17,money:10,pass:false,uniform:false,knowledge:1,errand:0,heat:0,log:'',tab:'gate',outcome:''})}
let s;try{s=JSON.parse(localStorage.getItem(key))||fresh();if(s.worldVersion!==InfactionWorld.version){s=fresh();save()}}catch(e){s=fresh()}function save(){try{localStorage.setItem(key,JSON.stringify(s))}catch(e){}}
let menu;function close(){menu?.remove();menu=null}function hold(button,options,tap){let timer,held=false,x,y;button.onpointerdown=e=>{close();held=false;x=e.clientX;y=e.clientY;timer=setTimeout(()=>{held=true;show(button,options)},450)};button.onpointermove=e=>{if(Math.abs(e.clientX-x)+Math.abs(e.clientY-y)>12)clearTimeout(timer)};button.onpointerup=button.onpointercancel=button.onpointerleave=()=>clearTimeout(timer);button.oncontextmenu=e=>{e.preventDefault();held=true;show(button,options)};button.onclick=()=>{if(!held)tap();held=false};button.onkeydown=e=>{if(e.key==='ArrowUp'||e.key==='ContextMenu'){e.preventDefault();show(button,options)}}}
function show(b,opts){close();menu=document.createElement('div');menu.className='bubble';for(let [label,fn] of opts){let a=document.createElement('button');a.textContent=label;a.onclick=e=>{e.stopPropagation();close();fn()};menu.append(a)}document.body.append(menu);let r=b.getBoundingClientRect();menu.style.left=Math.max(10,Math.min(r.left,innerWidth-menu.offsetWidth-10))+'px';menu.style.top=(r.top>menu.offsetHeight+18?r.top-menu.offsetHeight-8:r.bottom+8)+'px'}
function button(parent,label,tap,opts=[]){let b=document.createElement('button');b.textContent=label;parent.append(b);if(opts.length)hold(b,opts,tap);else b.onclick=tap;return b}
function update(msg,hours=0){s.log=msg;s.hour=((s.hour+hours)%24+24)%24;save();render()}function enter(method,detail){s.stage=3;s.outcome=method;s.log=detail;save();render()}const night=()=>s.hour>=19||s.hour<6;const clock=()=>{let m=Math.round(s.hour*60)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};function waitUntil(){close();let panel=document.createElement('div');panel.className='bubble';panel.style.left='50%';panel.style.top='32%';panel.style.transform='translateX(-50%)';let form=document.createElement('form');form.innerHTML='<label for="target-time">Wait until</label><input id="target-time" type="time" required><button type="submit">Wait</button><button type="button" id="cancel-wait">Cancel</button>';panel.append(form);document.body.append(panel);menu=panel;let input=form.querySelector('input');input.value=clock();form.querySelector('#cancel-wait').onclick=close;form.onsubmit=e=>{e.preventDefault();if(!input.value)return;let [h,m]=input.value.split(':').map(Number),target=h+m/60,elapsed=(Math.round(target*60)-Math.round(s.hour*60)+1440)%1440;if(!elapsed)elapsed=1440;s.heat=Math.max(0,s.heat-Math.floor(elapsed/60));s.hour=target;populate(s);update('You wait until '+clock()+'.')};}

// NPC controls share one provisional outcome resolver. A failed request never moves/removes the NPC.
function npcIntent(n,intent,method,target=null,after=false){
 if(!s.npcs.includes(n))return;
 const ok=method==='Force'||(method==='Intimidate'&&n.trait!=='cautious')||n.trust>0||(n.role!=='Guard'&&n.trait==='friendly'&&(method==='Request'||method==='Beg'));
 if(method==='Force'||method==='Intimidate')s.heat++;
 if(!ok)return update(n.name+' refuses.',1);
 if(intent==='dismiss'){s.npcs=s.npcs.filter(x=>x!==n);return update(n.name+' leaves.',1)}
 if(intent==='pin'){n.pinned=!n.pinned;return update(n.name+(n.pinned?' agrees to stay.':' is free to leave.'),1)}
 if(intent==='move'&&target!==n&&s.npcs.includes(target)){s.npcs=s.npcs.filter(x=>x!==n);s.npcs.splice(s.npcs.indexOf(target)+(after?1:0),0,n);return update(n.name+' moves.',1)}
}
function intentOptions(n,intent,target=null,after=false){
 const verb=intent==='dismiss'?'leave':intent==='pin'?(n.pinned?'leave when ready':'stay'):'move';
 return [['Request','Ask to '+verb],['Beg','Beg to '+verb],['Command','Order to '+verb],['Intimidate','Threaten to '+verb],['Force',intent==='dismiss'?'Push away':intent==='pin'?'Restrain':'Push aside']].map(([method,label])=>[label,()=>npcIntent(n,intent,method,target,after)]);
}
function bindNPC(card,n,options,tap){
 let start=null,timer=null,ready=false,drag=false,ghost=null,target=null,after=false,suppress=false;
 function clearMark(){document.querySelectorAll('.drop-before,.drop-after').forEach(x=>x.classList.remove('drop-before','drop-after'))}
 function reset(){clearTimeout(timer);clearMark();ghost?.remove();ghost=null;card.classList.remove('dragging');start=null;ready=false;drag=false;target=null}
 function down(x,y,mouse){close();reset();start={x,y,mouse};suppress=false;if(!mouse)timer=setTimeout(()=>{ready=true},450)}
 function move(x,y,event){if(!start)return;const dist=Math.hypot(x-start.x,y-start.y);if(!ready&&!start.mouse&&dist>12){reset();suppress=true;return}if(!drag&&dist>12&&(ready||start.mouse)){drag=true;suppress=true;clearTimeout(timer);close();card.classList.add('dragging');ghost=card.cloneNode(true);ghost.classList.remove('dragging');ghost.classList.add('drag-ghost');ghost.style.width=card.offsetWidth+'px';document.body.append(ghost)}if(!drag)return;if(event.cancelable)event.preventDefault();ghost.style.left=(x-35)+'px';ghost.style.top=(y-20)+'px';clearMark();const other=document.elementFromPoint(x,y)?.closest('.npc-card');target=other&&other!==card?other._npc:null;if(target){const r=other.getBoundingClientRect();after=y>r.top+r.height/2;other.classList.add(after?'drop-after':'drop-before')}}
 function up(){if(!start)return;const t=target,a=after,wasDrag=drag,wasReady=ready;reset();if(wasDrag){suppress=true;if(t)show(card,intentOptions(n,'move',t,a))}else if(wasReady){suppress=true;show(card,options)}}
 card.addEventListener('touchstart',e=>{if(e.target.closest('.npc-tools')||e.touches.length!==1)return;const t=e.touches[0];down(t.clientX,t.clientY,false)},{passive:true});
 card.addEventListener('touchmove',e=>{if(!start||start.mouse)return;const t=e.touches[0];move(t.clientX,t.clientY,e)},{passive:false});
 card.addEventListener('touchend',()=>{if(start&&!start.mouse)up()});card.addEventListener('touchcancel',reset);
 card.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'||e.button!==0||e.target.closest('.npc-tools'))return;down(e.clientX,e.clientY,true);card.setPointerCapture(e.pointerId)});
 card.addEventListener('pointermove',e=>{if(start?.mouse)move(e.clientX,e.clientY,e)});
 card.addEventListener('pointerup',e=>{if(start?.mouse)up()});card.addEventListener('pointercancel',reset);
 card.addEventListener('contextmenu',e=>{if(e.target.closest('.npc-tools'))return;e.preventDefault();reset();suppress=true;show(card,options)});
 card.addEventListener('click',e=>{if(e.target.closest('.npc-tools'))return;if(suppress){suppress=false;return}tap()});
 card.addEventListener('keydown',e=>{if(e.target!==card)return;if(e.key==='Enter'||e.key===' '){e.preventDefault();tap()}else if(e.key==='ArrowUp'||e.key==='ContextMenu'){e.preventDefault();show(card,options)}});
}
function render(){close();app.className=s.stage===2&&night()?'night':'';if(s.stage<2){app.innerHTML='<div class="intro"><h1></h1><p></p><div id="controls"></div></div>';let h=app.querySelector('h1'),p=app.querySelector('p'),c=app.querySelector('#controls');if(s.stage===0){h.textContent='Infaction is not as it seems.';p.innerHTML=(matchMedia("(hover: hover) and (pointer: fine)").matches?"When nothing is left, try what\u0027s right.":"If you think you can hold, don\u0027t tap.")+"<br><br>Are you ready?";button(c,"I'm not ready",()=>{},[["I'm ready",()=>{s.stage=1;save();render()}]])}else{h.textContent='Welcome to Infaction';p.textContent='Your first quest is to enter the '+s.city+'.';button(c,"I'm out",()=>{s.stage=0;save();render()},[["I'm in",()=>{s.stage=2;s.tab='gate';update('You arrive outside the city. The guard requires a pass.')}],["Change city",()=>{let next=fresh();for(let i=0;i<30&&next.city===s.city;i++)next=fresh();if(next.city===s.city)return; s=next;s.stage=1;save();render()}]])}return}
if(s.stage===3){app.innerHTML='<div class="intro"><small>QUEST COMPLETE</small><h1>'+s.city+'</h1><p>Entry: '+s.outcome+'</p><p>'+s.log+'</p><small>Money: '+s.money+' · Suspicion: '+s.heat+'</small><div id="controls"></div></div>';button(app.querySelector('#controls'),'New universe',()=>{s=fresh();save();render()});return}
app.innerHTML=' <div class="location-header"><div class="location-label"><h1 id="location">City Gate</h1><span id="time">'+clock()+' · '+(night()?'Night':'Day')+'</span></div><button id="more" aria-label="Menu">⋯</button></div><section class="log">'+s.log+'</section><div id="content"></div><nav id="nav" aria-label="Game navigation"></nav>';hold(app.querySelector('#location'),[['Observe',()=>update(night()?'The shadows reach the wall. The guard watches the main entrance.':'Travelers queue under the guard’s watch.')]],()=>{});hold(app.querySelector('#time'),[['Wait until',waitUntil]],()=>{s.hour=(s.hour+1)%24;s.heat=Math.max(0,s.heat-1);populate(s);update('An hour passes.')});for(let id of ['location','time']){let el=app.querySelector('#'+id);el.tabIndex=0;el.setAttribute('role','button')}app.querySelector('#more').onclick=()=>show(app.querySelector('#more'),[['Exit',()=>{s.stage=0;save();render()}],['New universe',()=>{if(confirm('Start a new universe?')){s=fresh();save();render()}}]]);for(let tab of ['gate','location','inventory']){let b=button(app.querySelector('#nav'),({gate:'Interaction',location:'Location',inventory:'Inventory'})[tab],()=>{s.tab=tab;save();render()});const label=b.textContent;const icons={gate:'<path d="M4 5h16v11H9l-5 4z"/>',location:'<path d="M20 10c0 5-8 11-8 11S4 15 4 10a8 8 0 1 1 16 0z"/><circle cx="12" cy="10" r="2.5"/>',inventory:'<rect x="4" y="7" width="16" height="14" rx="2"/><path d="M9 7V4h6v3M4 12h16"/>'};b.innerHTML='<svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+icons[tab]+'</svg><span>'+label+'</span>';if(s.tab===tab){b.className='selected';b.setAttribute('aria-current','page')}}let c=app.querySelector('#content');if(s.tab==='factions')s.tab='location';if(s.tab==='location'){const guardCount=s.npcs.filter(n=>n.role==='Guard').length;let sec=document.createElement('section');c.append(sec);let dest=button(sec,(guardCount?'🔒 ':'')+s.city,()=>{if(!guardCount)enter('Unguarded gate','You enter while the gate is unattended.')},[['Sneak in',()=>{if(!guardCount)return enter('Unguarded gate','You enter while the gate is unattended.');if(!night()||guardCount>=2)return update('You cannot sneak past the guards under these conditions.');s.heat++;enter('Infiltration','You slip through unseen. Your entry is unauthorized.')}]]);dest.classList.add('destination');if(guardCount)dest.classList.add('locked');return}if(s.tab==='inventory'){c.innerHTML='<section><small>ITEM</small><p>Money × '+s.money+'</p>'+(s.pass?'<p>Temporary Pass × 1</p>':'')+(s.uniform?'<p>Guard Uniform (worn)</p>':'')+'</section><section><small>KNOWLEDGE</small><p>'+s.city+' · Level '+s.knowledge+'</p></section><section><small>RECORD</small><p>Enter the City</p>'+(s.errand===1?'<p>Deliver the sealed note to the Guard.</p>':'')+'</section>';return}if(s.tab==='factions'){c.innerHTML=s.f.map(f=>'<section>'+f.name+'<br><small>'+f.types.join(' · ')+'</small></section>').join('');return}
if(!s.npcs.length)c.innerHTML='<section><small>No one is here.</small></section>';for(let n of s.npcs){let sec=document.createElement('div');sec.className='npc-card';sec.tabIndex=0;sec._npc=n;const name=document.createElement('span');name.className='npc-name';name.textContent=n.name;const tags=document.createElement('small');tags.className='npc-tags';tags.textContent=[n.role,n.faction,n.trait].join(' · ');const tools=document.createElement('div');tools.className='npc-tools';sec.append(name,tags,tools);c.append(sec);
const observe=()=>update(n.role==='Guard'?'A watchful guard checks passes.':n.role==='Traveler'?'A temporary pass hangs from their pouch.':n.role==='Courier'?'A courier carries sealed notes.':'A figure waits nearby.');
for(const [intent,label,svg] of [['pin',n.pinned?'Release':'Pin','<path d="M16 3l5 5-4 2-3 5-2 2-5-5 2-2 5-3zM4 20l7-7"/>'],['dismiss','Dismiss','<path d="M6 6l12 12M18 6L6 18"/>']]){const control=button(tools,label,()=>npcIntent(n,intent,'Request'),intentOptions(n,intent));control.setAttribute('aria-label',label);control.title=label;control.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+svg+'</svg>';if(intent==='pin'&&n.pinned)control.classList.add('pinned');for(const ev of ['click','contextmenu','pointerdown','pointerup','keydown'])control.addEventListener(ev,e=>e.stopPropagation())}
let opts=[];if(n.role==='Guard'){opts=[['Show pass',()=>{if(!s.pass)return update('You have no pass.');s.pass=false;enter('Permission','Your temporary pass is accepted and consumed.')}],['Deliver note',()=>{if(s.errand!==1)return update('You have nothing to deliver.');s.errand=2;s.pass=true;update('The guard accepts the note and issues a temporary pass.',1)}],['Offer bribe (6)',()=>{if(s.money<6)return update('Not enough money.');if(n.trait==='cautious'){s.heat++;return update('The guard refuses the bribe.',1)}s.money-=6;enter('Bribery','The guard pockets the money and lets you through.')}],['Claim official business',()=>{if(s.knowledge>=2&&n.trust>=1)enter('Persuasion','The guard lets you enter on your word.');else update('The guard demands proof.',1)}],['Pass as guard',()=>{if(s.uniform)enter('Disguise','You enter wearing a guard uniform.');else update('You need a uniform.')}]]}else if(n.role==='Courier'){opts=[['Ask for work',()=>{if(s.errand===0){s.errand=1;update('Deliver this sealed note to the guard. You will receive a temporary pass.')}else update('The courier has no more work.')}]]}else if(n.role==='Traveler'){opts=[['Ask about the city',()=>{s.knowledge=Math.max(2,s.knowledge);update('You learn how official business is verified.',1)}],['Steal pass',()=>{if(s.pass)return update('You already have a pass.');if(!night()&&n.trait==='cautious'){s.heat++;return update('The traveler notices you.',1)}s.pass=true;s.heat++;update('You take the temporary pass.',1)}]]}else if(n.role==='Smuggler'){opts=[['Buy uniform (8)',()=>{if(s.money<8||s.uniform)return update('No deal.');s.money-=8;s.uniform=true;update('You buy and wear a guard uniform.')}]]}bindNPC(sec,n,[['Socialize',()=>{if(n.trust<1)n.trust++;update(n.name+' exchanges a few words with you.',1)}],...opts],observe)}
}document.addEventListener('pointerdown',e=>{if(menu&&!menu.contains(e.target)&&e.target.tagName!=='BUTTON'&&!e.target.closest('#location,#time'))close()});render();
</script></body></html>
