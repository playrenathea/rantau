name: Infaction Flavor v2 QA
on:
  push:
    branches: [main]
    paths:
      - 'infaction_place_naming_locked.py'
      - 'infaction_hidden_restricted_locked.py'
      - 'tests/test_infaction_naming_rules.py'
      - 'tests/test_infaction_city_gatehouse.py'
      - 'data/infaction_*flavor*.json'
      - 'data/infaction_place_impression_tags_v2.json'
      - 'notebooks/Infaction_v0.4.8_World_Access_HOTFIX_20261122.ipynb'
      - 'tests/test_infaction_naming_redundancy.py'
      - 'tests/qa_infaction_flavor_v2_candidate.py'
      - 'tests/smoke_infaction_v048_colab.py'
      - '.github/workflows/infaction-flavor-v2-qa.yml'
  workflow_dispatch:
jobs:
  integrity-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Candidate and legacy integrity
        run: python tests/qa_infaction_flavor_v2_candidate.py
      - name: Literal redundancy regressions
        run: python -m unittest discover -s tests -p 'test_infaction_naming_redundancy.py' -v
      - name: City-only naming and City Gatehouse regression
        run: |
          python -m unittest discover -s tests -p 'test_infaction_naming_rules.py' -v
          python -m unittest discover -s tests -p 'test_infaction_city_gatehouse.py' -v
      - name: Active vocab and mapping invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          a=json.loads(Path("data/infaction_animal_place_flavor_v2.json").read_text())
          b=json.loads(Path("data/infaction_place_impression_tags_v2.json").read_text())
          assert len(a["records"])==291
          assert len(b["flavor_tags"])==291
          assert a["production_default_unchanged"] is False
          assert a["status"].startswith("ACTIVE")
          assert b["status"]=="ACTIVE_FOR_PLACE_NAMING"
          assert {r["word"] for r in a["records"]}==set(b["flavor_tags"])
          assert all(1<=len(t)<=6 for t in b["flavor_tags"].values())
          print("PASS: Active vocabulary and Impression Tags")
          PY
  integrated-colab-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: integrity-and-regression
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run integrated notebook headlessly
        env:
          PYTHONUNBUFFERED: '1'
        run: python tests/smoke_infaction_v048_colab.py
