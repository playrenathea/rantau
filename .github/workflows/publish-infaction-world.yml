name: Publish Infaction Current World

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'infaction-mvp.js'
      - '.github/workflows/publish-infaction-world.yml'

permissions:
  contents: write

concurrency:
  group: infaction-publish-world
  cancel-in-progress: false

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Generate full v0.4.8 World with active Flavor v2
        env:
          PYTHONUNBUFFERED: '1'
        run: python tests/smoke_infaction_v048_colab.py
      - name: Publish latest generated world JSON
        shell: bash
        run: |
          python - <<'PY'
          import glob,json,shutil,pathlib
          exports=glob.glob('infaction_world_named_seed_*_v0.4.8-access.json')
          assert len(exports)==1, f"Expected exactly one new export, got: {exports}"
          target=pathlib.Path('data/infaction_current_world.json')
          shutil.copyfile(exports[0],target)
          obj=json.loads(target.read_text(encoding='utf-8'))
          assert len(obj['factions'])==6
          assert obj['place_naming']['vocabulary_version']=='animal-place-flavor-v2-active-2026-11-22'
          assert obj['place_naming']['impression_version']=='impression-tags-v2-active-2026-11-22'
          assert obj['places']['nodes'] and isinstance(obj['access_nodes'],list)
          print('Published world:',target,'Places:',len(obj['places']['nodes']),'Access:',len(obj['access_nodes']))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/infaction_current_world.json
          if git diff --cached --quiet; then
            echo 'No world changes'
          else
            git commit -m "Publish generated Infaction v0.4.8 world for MVP"
            git push origin HEAD:main
          fi
